<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1E24">
<title>RehaVerse — Adaptive Rehabilitation Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Atkinson Hyperlegible : แยกรูปตัวอักษรที่สับสนง่ายออกจากกัน (0/O, 1/l/I) ใช้กับละตินและตัวเลข
  Noto Sans Thai Looped : อักษรไทยแบบมีหัว ซึ่งเป็นรูปที่เด็กไทยหัดอ่านเป็นแบบแรก
  IBM Plex : เฉพาะหน้านักกายภาพซึ่งเป็นผู้ใหญ่
-->
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Thai+Looped:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-face="child">

<a class="skip" href="#root">ข้ามไปที่เนื้อหา</a>

<!-- ==========================================================================
     ฉากหลัง : ท้องฟ้ากลางคืนไล่สีน้ำเงินเข้มไปม่วงเข้ม พร้อมดาวที่ "ไม่ขยับ"
     ตั้งใจให้นิ่งสนิท เพราะการเคลื่อนไหวพื้นหลังดึงความสนใจออกจากงานตรงหน้า
     ========================================================================== -->
<div class="space" aria-hidden="true">
  <!-- แสงออโรราสองก้อนเคลื่อนช้ามาก (~1 นาทีต่อรอบ) ทำให้ฉากมีชีวิตโดยไม่ดึงสายตา -->
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <svg class="starfield" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
    <!-- ดาวแบ่งสามกลุ่ม กะพริบคนละจังหวะ จึงไม่วูบพร้อมกันทั้งจอ -->
    <g fill="#FFFFFF" class="tw tw1">
      <circle cx="24"  cy="38"  r="2.2" opacity=".55"/><circle cx="206" cy="24"  r="1.2" opacity=".3"/>
      <circle cx="268" cy="60"  r="2.4" opacity=".5"/> <circle cx="52"  cy="104" r="1.5" opacity=".33"/>
      <circle cx="246" cy="140" r="1.7" opacity=".4"/> <circle cx="18"  cy="176" r="1.9" opacity=".44"/>
      <circle cx="228" cy="216" r="1.3" opacity=".3"/> <circle cx="356" cy="238" r="2"   opacity=".45"/>
      <circle cx="176" cy="268" r="1.2" opacity=".3"/> <circle cx="340" cy="388" r="1.3" opacity=".3"/>
    </g>
    <g fill="#FFFFFF" class="tw tw2">
      <circle cx="88"  cy="16"  r="1.3" opacity=".35"/><circle cx="330" cy="30"  r="1.4" opacity=".38"/>
      <circle cx="118" cy="132" r="2.1" opacity=".48"/><circle cx="312" cy="112" r="2.3" opacity=".5"/>
      <circle cx="96"  cy="208" r="1.4" opacity=".34"/><circle cx="292" cy="192" r="1.8" opacity=".41"/>
      <circle cx="112" cy="292" r="2.1" opacity=".46"/><circle cx="304" cy="276" r="2.2" opacity=".48"/>
      <circle cx="28"  cy="344" r="1.8" opacity=".42"/><circle cx="264" cy="358" r="2"  opacity=".44"/>
    </g>
    <g fill="#FFFFFF" class="tw tw3">
      <circle cx="147" cy="52"  r="1.8" opacity=".45"/><circle cx="378" cy="74"  r="1.9" opacity=".42"/>
      <circle cx="184" cy="98"  r="1.2" opacity=".3"/> <circle cx="366" cy="158" r="1.3" opacity=".32"/>
      <circle cx="160" cy="184" r="2.2" opacity=".47"/><circle cx="42"  cy="262" r="1.5" opacity=".35"/>
      <circle cx="240" cy="304" r="1.7" opacity=".4"/> <circle cx="370" cy="322" r="1.4" opacity=".33"/>
      <circle cx="132" cy="372" r="1.5" opacity=".36"/>
    </g>
    <!-- เส้นเรขาคณิตจาง ๆ ให้พื้นหลังมีมิติ แต่ไม่แย่งสายตา -->
    <g stroke="#98DFEA" stroke-width="1" opacity=".10" fill="none">
      <path d="M-20 120 L120 20 L280 96 L420 12"/>
      <path d="M-20 300 L140 232 L300 320 L420 250"/>
    </g>
  </svg>
</div>

<div class="shell" id="shell">
  <header class="topbar" id="topbar"></header>
  <main id="root"></main>
  <p class="foot" id="foot"></p>
</div>

<!-- แถบช่วยเหลือถาวร : อยู่ตำแหน่งเดิมทุกหน้าจอ -->
<nav class="assist" id="assist" aria-label="ปุ่มช่วยเหลือ" hidden></nav>

<!-- หน้าต่างช่วยเหลือ -->
<div class="helpwrap" id="helpwrap" role="dialog" aria-modal="true" aria-labelledby="helptitle" hidden></div>

<!-- ป้ายฉลองเมื่อทำสำเร็จ : เครื่องหมายถูกขนาดใหญ่เต็มจอ -->
<div class="cheer" id="cheer" aria-hidden="true" hidden></div>

<div class="sr" id="live" role="status" aria-live="polite"></div>

<!--
  โหลดตามลำดับ : ไฟล์ก่อนหน้าต้องประกาศสิ่งที่ไฟล์ถัดไปใช้ตอนโหลดเสร็จแล้ว
  core ต้องมาก่อนเพราะประกาศ SC ที่ทุกหน้าจอเติมเข้าไป
  app ต้องมาท้ายสุดเพราะบรรทัดสุดท้ายคือ render() ที่เริ่มทำงานจริง
-->
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/feedback.js"></script>
<script src="js/screens.js"></script>
<script src="js/game.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
